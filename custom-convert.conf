# Output formats from least to most favorite: flac is preferred over pcm.
proxy shn pcm,flc

shn pcm * *
	# FT:{START=-ss %s}
	[ffmpeg] -loglevel quiet $START$ -i $FILE$ -vn -f s16le -acodec pcm_s16le -

shn flc * *
	# FT:{START=-ss %s}
	[ffmpeg] -loglevel quiet $START$ -i $FILE$ -vn -f flac -compression_level 0 -

shn wav * *
	# FT:{START=-ss %s}
	[ffmpeg] -loglevel quiet $START$ -i $FILE$ -vn -f wav -

shn mp3 * *
	# FT:{START=-ss %s}B:{BITRATE=--abr %B}
	[ffmpeg] -loglevel quiet $START$ -i $FILE$ -vn -f wav -acodec pcm_s16le - | [lame] --silent -q $QUALITY$ $BITRATE$ - -

